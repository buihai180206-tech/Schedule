<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B0E1A">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Dayflow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#0B0E1A; --surface:#151A2E; --surface-2:#1D2338;
    --text:#EDEFF7; --text-dim:#9096B5;
    --line: rgba(237,239,247,0.10);
    --dawn:#F2A65A; --noon:#FFD166; --dusk:#EF6F6C; --night:#7C6FF0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; background:#05060D;}
  body{ font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent; }
  .app{
    min-height:100vh; max-width:460px; margin:0 auto; background:var(--ink); color:var(--text);
    padding: calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 32px);
  }
  .topbar{ display:flex; align-items:center; justify-content:space-between; }
  .wordmark{ font-family:'Fraunces',serif; font-weight:600; font-style:italic; font-size:24px; letter-spacing:-0.01em; }
  .icon-btn{ width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:active{ transform:scale(0.94); }

  .date-row{ margin-top:22px; }
  .day-label{ font-family:'Fraunces',serif; font-weight:600; font-size:28px; }
  .date-sub{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); margin-top:4px; }

  .arc-wrap{ margin:28px 0 8px; }
  .arc{ display:flex; align-items:center; }
  .arc-node{ flex:0 0 auto; width:14px; height:14px; border-radius:50%; background:var(--surface-2); border:2px solid var(--line); position:relative; }
  .arc-node.active{ box-shadow:0 0 0 5px color-mix(in srgb, var(--nc) 25%, transparent); border-color: var(--nc); background:var(--nc); }
  .arc-line{ flex:1; height:2px; background:var(--line); margin:0 2px; }
  .arc-line.filled{ background:linear-gradient(90deg, var(--lc), var(--rc)); }
  .arc-labels{ display:flex; justify-content:space-between; margin-top:8px; }
  .arc-labels span{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-dim); width:14px; text-align:center; }

  .slot-card{ margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; border-left:3px solid var(--sc); }
  .slot-head{ display:flex; align-items:center; gap:8px; }
  .slot-dot{ width:8px; height:8px; border-radius:50%; background:var(--sc); }
  .slot-name{ font-family:'Fraunces',serif; font-weight:500; font-size:15px; color:var(--text-dim); }
  .activity-list{ margin-top:8px; }
  .activity-row{ display:flex; gap:12px; align-items:center; padding:7px 0; border-top:1px solid var(--line); cursor:pointer; }
  .activity-row:first-child{ border-top:none; padding-top:2px; }
  .activity-time{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); width:40px; flex-shrink:0; }
  .activity-text{ font-size:15px; line-height:1.5; flex:1; }
  .activity-text.done{ text-decoration: line-through; color:var(--text-dim); }
  .activity-text.missed{ color:var(--text-dim); }
  .slot-task.empty{ margin-top:8px; color:var(--text-dim); font-style:italic; font-size:15px; }

  .activity-check{
    appearance:none; -webkit-appearance:none; width:19px; height:19px; border-radius:6px; flex-shrink:0;
    border:1.5px solid var(--line); background:var(--surface-2); cursor:pointer; position:relative;
  }
  .activity-check:checked{ background:var(--night); border-color:var(--night); }
  .activity-check:checked::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .activity-check:disabled{ cursor:default; }
  .activity-check:disabled:not(:checked){ border-color: var(--dusk); background: rgba(239,111,108,0.12); }
  .activity-check:disabled:not(:checked)::after{ content:'✕'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--dusk); }
  .activity-check:disabled:checked{ opacity:0.85; }

  .stats-teaser{
    margin-top:14px; display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 18px; cursor:pointer;
  }
  .stats-teaser-pct{ font-family:'Fraunces',serif; font-weight:600; color:var(--night); }
  .stats-teaser-arrow{ color:var(--text-dim); }

  .stats-hero{ text-align:center; margin-top:26px; }
  .stats-pct{ font-family:'Fraunces',serif; font-weight:600; font-size:52px; color:var(--night); }
  .stats-sub{ margin-top:6px; font-size:13px; color:var(--text-dim); }
  .stats-day-list{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:4px 18px; margin-bottom:12px; }
  .stats-day-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-top:1px solid var(--line); font-size:14px; }
  .stats-day-row:first-child{ border-top:none; }
  .stats-day-frac{ font-family:'IBM Plex Mono'; font-size:13px; color:var(--text-dim); }

  .section-label{ margin: 26px 0 10px; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim); font-weight:600; }

  .day-block{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; }
  .day-block-title{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin-bottom:6px; }
  .day-block.today{ border-color: var(--night); }

  .slot-edit-block{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .slot-edit-block:first-of-type{ margin-top:8px; }
  .slot-edit-head{ display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); margin-bottom:8px; }
  .mini-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .activity-edit-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .activity-edit-row input[type="time"]{
    width:92px; flex-shrink:0; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:8px 8px; font-size:12px; font-family:'IBM Plex Mono'; outline:none;
    color-scheme: dark;
  }
  .activity-edit-row input[type="text"]{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:9px 11px; font-size:13px; font-family:'Inter'; outline:none;
  }
  .activity-edit-row input:focus{ border-color: var(--night); }
  .del-btn{ background:none; border:none; color:var(--dusk); font-size:14px; cursor:pointer; padding:4px; flex-shrink:0; }
  .add-activity-btn{
    width:100%; padding:9px; border-radius:10px; border:1px dashed var(--line); background:transparent;
    color:var(--text-dim); font-size:12px; cursor:pointer; margin-top:2px;
  }
  .add-activity-btn:active{ transform:scale(0.98); }

  .hint{ margin-top:14px; font-size:12px; color:var(--text-dim); text-align:center; line-height:1.5; }
  .reset-btn{ margin-top:22px; width:100%; padding:13px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--text-dim); font-size:13px; cursor:pointer; }
  .notif-btn{ margin-top:16px; width:100%; padding:13px; border-radius:14px; border:1px solid var(--night); background:transparent; color:var(--text); font-size:13px; cursor:pointer; }

  .sync-box{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; }
  .sync-box input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:10px 12px; font-size:13px; font-family:'Inter'; outline:none; margin-bottom:10px;
  }
  .sync-box input:focus{ border-color: var(--night); }
  .sync-btn-row{ display:flex; gap:10px; }
  .sync-btn{ flex:1; padding:11px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); color:var(--text); font-size:13px; cursor:pointer; }
  .sync-btn:active{ transform:scale(0.97); }
  .sync-status{ margin-top:10px; font-size:12px; color:var(--text-dim); text-align:left; line-height:1.5; }
  .sync-url-box{ margin-top:10px; font-size:11px; color:var(--text-dim); text-align:left; line-height:1.5; word-break:break-all; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-family:'IBM Plex Mono'; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const STORE_KEY = "dayflow-schedule-v2";
const SYNC_KEY = "dayflow-sync-v1";
const GIST_FILENAME = "dayflow-schedule.json";
// English weekday keys used inside the synced Gist JSON — Shortcuts can
// reliably produce these via Format Date (EEEE, locale en_US, lowercased).
const DAY_KEYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday']; // index = JS getDay()

const DAYS = [
  {jsDay:1, label:'Thứ Hai'},
  {jsDay:2, label:'Thứ Ba'},
  {jsDay:3, label:'Thứ Tư'},
  {jsDay:4, label:'Thứ Năm'},
  {jsDay:5, label:'Thứ Sáu'},
  {jsDay:6, label:'Thứ Bảy'},
  {jsDay:0, label:'Chủ Nhật'},
];

const SLOTS = [
  {key:'sang', label:'Sáng', varName:'--dawn'},
  {key:'trua', label:'Trưa', varName:'--noon'},
  {key:'chieu', label:'Chiều', varName:'--dusk'},
  {key:'toi', label:'Tối', varName:'--night'},
];

let idCounter = 1;
function genId(){ return 'a' + (idCounter++) + '_' + Date.now().toString(36); }

function emptyDay(){ return {sang:[], trua:[], chieu:[], toi:[]}; }

function loadSchedule(){
  let data;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    data = raw ? JSON.parse(raw) : null;
  }catch(e){ data = null; }

  // migrate from old single-text-per-slot format (dayflow-schedule-v1) if present and v2 missing
  if(!data){
    try{
      const oldRaw = localStorage.getItem('dayflow-schedule-v1') || localStorage.getItem('nhip-tuan-schedule-v1');
      if(oldRaw){
        const old = JSON.parse(oldRaw);
        data = {};
        DAYS.forEach(d=>{
          const day = old[d.jsDay] || {};
          const nd = emptyDay();
          SLOTS.forEach(s=>{
            const v = (day[s.key]||'').trim();
            if(v) nd[s.key] = [{id:genId(), time:'', text:v}];
          });
          data[d.jsDay] = nd;
        });
      }
    }catch(e){}
  }

  if(!data) data = {};
  DAYS.forEach(d=>{
    if(!data[d.jsDay]) data[d.jsDay] = emptyDay();
    SLOTS.forEach(s=>{
      if(!Array.isArray(data[d.jsDay][s.key])) data[d.jsDay][s.key] = [];
      data[d.jsDay][s.key].forEach(a=>{ if(!a.id) a.id = genId(); });
    });
  });
  return data;
}

let schedule = loadSchedule();
let state = { view: 'today' };

function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(schedule)); }

function loadSyncConfig(){
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { token:'', gistId:'', username:'', lastSync:'' };
}
let syncConfig = loadSyncConfig();
function saveSyncConfig(){ localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig)); }

function formatTime(d){ return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

// Slot is derivable purely from the hour, same ranges as currentSlotKey().
// This lets us sync a flat {time -> text} map per day (what Shortcuts can
// look up with one exact-time key) and still rebuild the right slot locally.
function slotForTime(hhmm){
  const h = parseInt((hhmm||'').split(':')[0], 10);
  if(h>=4 && h<11) return 'sang';
  if(h>=11 && h<13) return 'trua';
  if(h>=13 && h<18) return 'chieu';
  return 'toi';
}

function scheduleToGistPayload(sch){
  const out = {};
  DAYS.forEach(d=>{
    const dayOut = {};
    SLOTS.forEach(s=>{
      (sch[d.jsDay][s.key]||[]).forEach(a=>{
        const time = (a.time||'').trim(), text = (a.text||'').trim();
        if(time && text) dayOut[time] = text; // last one wins on a duplicate time
      });
    });
    out[DAY_KEYS[d.jsDay]] = dayOut;
  });
  return out;
}
function gistPayloadToSchedule(payload){
  const out = {};
  DAYS.forEach(d=>{
    const dayOut = emptyDay();
    const rec = (payload && payload[DAY_KEYS[d.jsDay]]) || {};
    Object.keys(rec).forEach(time=>{
      const text = (rec[time]||'').trim();
      if(!text) return;
      dayOut[slotForTime(time)].push({id:genId(), time, text});
    });
    out[d.jsDay] = dayOut;
  });
  return out;
}

async function ghRequest(url, options={}){
  const headers = Object.assign({
    'Authorization': `Bearer ${syncConfig.token}`,
    'Accept': 'application/vnd.github+json'
  }, options.headers||{});
  const res = await fetch(url, Object.assign({}, options, {headers}));
  if(!res.ok){
    let detail = '';
    try{ detail = (await res.json()).message || ''; }catch(e){}
    throw new Error(`${res.status}${detail ? ' - '+detail : ''}`);
  }
  return res.json();
}

async function createGist(){
  const payload = scheduleToGistPayload(schedule);
  const body = {
    description: 'Dayflow - lịch tuần (đồng bộ Web ⇄ Shortcuts)',
    public: false,
    files: { [GIST_FILENAME]: { content: JSON.stringify(payload, null, 2) } }
  };
  const data = await ghRequest('https://api.github.com/gists', { method:'POST', body: JSON.stringify(body) });
  syncConfig.gistId = data.id;
  syncConfig.username = data.owner ? data.owner.login : '';
  syncConfig.lastSync = new Date().toISOString();
  saveSyncConfig();
  return data;
}

async function pushToGist(){
  if(!syncConfig.token || !syncConfig.gistId) return;
  const payload = scheduleToGistPayload(schedule);
  const body = { files: { [GIST_FILENAME]: { content: JSON.stringify(payload, null, 2) } } };
  const data = await ghRequest(`https://api.github.com/gists/${syncConfig.gistId}`, { method:'PATCH', body: JSON.stringify(body) });
  syncConfig.username = data.owner ? data.owner.login : syncConfig.username;
  syncConfig.lastSync = new Date().toISOString();
  saveSyncConfig();
  return data;
}

async function pullFromGist(){
  if(!syncConfig.token || !syncConfig.gistId) return;
  const data = await ghRequest(`https://api.github.com/gists/${syncConfig.gistId}`);
  const file = data.files && data.files[GIST_FILENAME];
  if(file && file.content){
    schedule = gistPayloadToSchedule(JSON.parse(file.content));
    persist();
  }
  syncConfig.username = data.owner ? data.owner.login : syncConfig.username;
  syncConfig.lastSync = new Date().toISOString();
  saveSyncConfig();
  return data;
}

function syncRawUrl(){
  if(!syncConfig.gistId || !syncConfig.username) return '';
  return `https://gist.githubusercontent.com/${syncConfig.username}/${syncConfig.gistId}/raw/${GIST_FILENAME}`;
}

function setSyncStatusText(msg){
  const el = document.getElementById('sync-status');
  if(el) el.textContent = msg;
}

function syncStatusLabel(){
  if(!syncConfig.gistId) return 'Chưa thiết lập đồng bộ.';
  if(!syncConfig.lastSync) return 'Đã lưu Gist ID, chưa đồng bộ lần nào.';
  return 'Đã đồng bộ lúc ' + formatTime(new Date(syncConfig.lastSync));
}

let pushTimer = null;
function schedulePush(){
  if(!syncConfig.token || !syncConfig.gistId) return;
  setSyncStatusText('Đang đồng bộ...');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{
    pushToGist()
      .then(()=> setSyncStatusText('Đã đồng bộ lúc ' + formatTime(new Date())))
      .catch(err=> setSyncStatusText('Lỗi đồng bộ: ' + err.message));
  }, 900);
}

// ---- Hoàn thành hoạt động & thống kê tuần ----
const COMPLETIONS_KEY = "dayflow-completions-v1";
// Giờ kết thúc mỗi buổi (dùng để khoá ô tích khi buổi đã trôi qua trong hôm nay).
// "toi" coi như hết hạn lúc sang ngày mới (24h) vì màn hình luôn hiển thị đúng ngày hiện tại.
const SLOT_END_HOUR = { sang:11, trua:13, chieu:19, toi:24 };

// Khung giờ hợp lệ được phép chọn cho từng buổi — không cho đặt giờ lệch buổi
// (vd 00:30 phải điền vào buổi Sáng, không được điền vào buổi Tối).
const SLOT_RANGE = {
  sang:  { min:'00:00', max:'10:59' },
  trua:  { min:'11:00', max:'12:59' },
  chieu: { min:'13:00', max:'18:59' },
  toi:   { min:'19:00', max:'23:59' },
};
function isTimeInSlotRange(time, slotKey){
  if(!time) return true; // không đặt giờ thì không cần kiểm tra
  const r = SLOT_RANGE[slotKey];
  return time >= r.min && time <= r.max;
}

function dateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function loadCompletions(){
  try{
    const raw = localStorage.getItem(COMPLETIONS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
let completions = loadCompletions();
function saveCompletions(){ localStorage.setItem(COMPLETIONS_KEY, JSON.stringify(completions)); }

function isCompleted(dKey, actId){ return !!(completions[dKey] && completions[dKey][actId]); }
function setCompleted(dKey, actId, val){
  if(!completions[dKey]) completions[dKey] = {};
  if(val) completions[dKey][actId] = true;
  else delete completions[dKey][actId];
  saveCompletions();
}

// Một buổi của một ngày đã "khoá" (không tích được nữa) khi: ngày đó là quá khứ,
// hoặc ngày đó là hôm nay nhưng giờ hiện tại đã qua mốc kết thúc buổi.
function isSlotLocked(dKey, slotKey, now){
  const tKey = dateKey(now);
  if(dKey < tKey) return true;
  if(dKey > tKey) return false;
  return now.getHours() >= SLOT_END_HOUR[slotKey];
}

// Thống kê 7 ngày gần nhất (tính cả hôm nay). Chỉ tính những hoạt động mà
// buổi của nó đã khoá (đã tới hạn) — buổi chưa tới thì chưa có kết quả nên
// không đưa vào mẫu số.
function computeWeeklyStats(){
  const now = new Date();
  let total = 0, done = 0;
  const days = [];
  for(let i=6; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const dKey = dateKey(d);
    const jsDay = d.getDay();
    const daySchedule = schedule[jsDay] || emptyDay();
    let dayTotal = 0, dayDone = 0;
    SLOTS.forEach(s=>{
      (daySchedule[s.key]||[]).forEach(a=>{
        if(!(a.text||'').trim()) return;
        if(!isSlotLocked(dKey, s.key, now)) return;
        dayTotal++;
        if(isCompleted(dKey, a.id)) dayDone++;
      });
    });
    total += dayTotal; done += dayDone;
    days.push({ dateKey:dKey, label: DAYS.find(x=>x.jsDay===jsDay).label, total:dayTotal, done:dayDone });
  }
  const pct = total>0 ? Math.round(done/total*100) : 0;
  return { total, done, pct, days };
}

function currentSlotKey(){
  const h = new Date().getHours();
  if(h<11) return 'sang';
  if(h<13) return 'trua';
  if(h<19) return 'chieu';
  return 'toi';
}

function pad2(n){ return String(n).padStart(2,'0'); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function notifBtnHtml(){
  if(!('Notification' in window)) return '';
  if(Notification.permission === 'granted') return '';
  return `<button class="notif-btn" id="notif-btn">Bật thông báo nhắc giờ hoạt động</button>`;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = state.view === 'today' ? renderToday() : (state.view === 'stats' ? renderStats() : renderEdit());
  bindEvents();
}

function renderToday(){
  const now = new Date();
  const jsDay = now.getDay();
  const dayInfo = DAYS.find(d=>d.jsDay===jsDay);
  const dateStr = `${pad2(now.getDate())}/${pad2(now.getMonth()+1)}/${now.getFullYear()}`;
  const todaySchedule = schedule[jsDay] || emptyDay();
  const todayKey = dateKey(now);
  const activeKey = currentSlotKey();
  const activeIdx = SLOTS.findIndex(s=>s.key===activeKey);

  let arcHtml = '<div class="arc">';
  SLOTS.forEach((s,i)=>{
    arcHtml += `<div class="arc-node ${i===activeIdx?'active':''}" style="--nc:var(${s.varName})"></div>`;
    if(i < SLOTS.length-1){
      const filled = i < activeIdx;
      arcHtml += `<div class="arc-line ${filled?'filled':''}" style="--lc:var(${s.varName}); --rc:var(${SLOTS[i+1].varName});"></div>`;
    }
  });
  arcHtml += '</div><div class="arc-labels">' + SLOTS.map(s=>`<span>${s.label[0]}</span>`).join('') + '</div>';

  const cards = SLOTS.map(s=>{
    const activities = (todaySchedule[s.key]||[]).slice().sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
    const withText = activities.filter(a=>(a.text||'').trim());
    const locked = isSlotLocked(todayKey, s.key, now);
    const list = withText.length
      ? `<div class="activity-list">${withText.map(a=>{
          const done = isCompleted(todayKey, a.id);
          const missed = locked && !done;
          return `
          <label class="activity-row">
            <input type="checkbox" class="activity-check" data-check="${todayKey}|${a.id}" ${done?'checked':''} ${locked?'disabled':''}>
            <span class="activity-time">${a.time?escapeHtml(a.time):''}</span>
            <span class="activity-text ${done?'done':''} ${missed?'missed':''}">${escapeHtml(a.text)}</span>
          </label>
        `;}).join('')}</div>`
      : `<div class="slot-task empty">Không có công việc nào</div>`;
    return `
      <div class="slot-card" style="--sc:var(${s.varName})">
        <div class="slot-head"><span class="slot-dot"></span><span class="slot-name">${s.label}</span></div>
        ${list}
      </div>
    `;
  }).join('');

  const stats = computeWeeklyStats();

  return `
    <div class="topbar">
      <div class="wordmark">Dayflow</div>
      <button class="icon-btn" id="edit-btn" aria-label="Chỉnh sửa lịch tuần">✎</button>
    </div>
    <div class="date-row">
      <div class="day-label">${dayInfo.label}</div>
      <div class="date-sub">${dateStr}</div>
    </div>
    <div class="arc-wrap">${arcHtml}</div>
    ${cards}
    <div class="stats-teaser" id="stats-teaser">
      <span>Tuần này: <span class="stats-teaser-pct">${stats.pct}%</span> hoàn thành (${stats.done}/${stats.total})</span>
      <span class="stats-teaser-arrow">→</span>
    </div>
    ${notifBtnHtml()}
  `;
}

function renderStats(){
  const { total, done, pct, days } = computeWeeklyStats();
  const rows = days.map(d=>`
    <div class="stats-day-row">
      <span>${d.label}</span>
      <span class="stats-day-frac">${d.total ? `${d.done}/${d.total}` : '—'}</span>
    </div>
  `).join('');

  return `
    <div class="topbar">
      <div class="wordmark">Thống kê tuần</div>
      <button class="icon-btn" id="back-stats-btn" aria-label="Quay lại">←</button>
    </div>
    <div class="stats-hero">
      <div class="stats-pct">${pct}%</div>
      <div class="stats-sub">${done}/${total} hoạt động đã hoàn thành (7 ngày qua)</div>
    </div>
    <div class="section-label">Theo ngày</div>
    <div class="stats-day-list">${rows}</div>
    <div class="hint">Hoạt động nào đã qua buổi (sáng/trưa/chiều/tối) mà chưa tích sẽ tự tính là chưa hoàn thành và khoá ô tích lại. Chỉ hoạt động đã tới hạn mới được tính vào thống kê.</div>
  `;
}

function renderEdit(){
  const now = new Date();
  const todayJsDay = now.getDay();

  const blocks = DAYS.map(d=>{
    const slotsHtml = SLOTS.map(s=>{
      const activities = schedule[d.jsDay][s.key] || [];
      const rows = activities.map(a=>`
        <div class="activity-edit-row">
          <input type="time" min="${SLOT_RANGE[s.key].min}" max="${SLOT_RANGE[s.key].max}" value="${escapeHtml(a.time||'')}" data-act-time="${d.jsDay}|${s.key}|${a.id}">
          <input type="text" value="${escapeHtml(a.text||'')}" data-act-text="${d.jsDay}|${s.key}|${a.id}" placeholder="hoạt động">
          <button class="del-btn" data-act-del="${d.jsDay}|${s.key}|${a.id}">✕</button>
        </div>
      `).join('');
      return `
        <div class="slot-edit-block">
          <div class="slot-edit-head"><span class="mini-dot" style="background:var(${s.varName})"></span><span>${s.label}</span><span style="opacity:0.6;">(${SLOT_RANGE[s.key].min}–${SLOT_RANGE[s.key].max})</span></div>
          ${rows}
          <button class="add-activity-btn" data-act-add="${d.jsDay}|${s.key}">+ Thêm hoạt động</button>
        </div>
      `;
    }).join('');
    return `
      <div class="day-block ${d.jsDay===todayJsDay?'today':''}">
        <div class="day-block-title">${d.label}${d.jsDay===todayJsDay?' · hôm nay':''}</div>
        ${slotsHtml}
      </div>
    `;
  }).join('');

  return `
    <div class="topbar">
      <div class="wordmark">Chỉnh lịch tuần</div>
      <button class="icon-btn" id="back-btn" aria-label="Quay lại">←</button>
    </div>
    <div class="hint" style="text-align:left; margin-top:16px;">Mỗi buổi có thể thêm nhiều hoạt động, mỗi hoạt động gắn 1 giờ cụ thể (không bắt buộc) — giờ phải nằm trong đúng khung của buổi đó (Sáng 00:00–10:59, Trưa 11:00–12:59, Chiều 13:00–18:59, Tối 19:00–23:59), ví dụ 00:30 phải điền vào buổi Sáng chứ không phải Tối. Đến đúng giờ đó, app sẽ gửi thông báo nhắc nếu bạn đã bật thông báo và app đang mở.</div>
    <div class="section-label">Cả tuần</div>
    ${blocks}

    <div class="section-label">Đồng bộ (để Shortcuts đọc được)</div>
    <div class="sync-box">
      <input id="sync-token" type="password" autocomplete="off" placeholder="GitHub token (quyền: gist)" value="${escapeHtml(syncConfig.token)}">
      <input id="sync-gistid" type="text" autocomplete="off" placeholder="Gist ID (để trống nếu chưa có)" value="${escapeHtml(syncConfig.gistId)}">
      <div class="sync-btn-row">
        <button class="sync-btn" id="sync-save-btn">Lưu & đồng bộ ngay</button>
        <button class="sync-btn" id="sync-create-btn">Tạo Gist mới</button>
      </div>
      <div class="sync-status" id="sync-status">${escapeHtml(syncStatusLabel())}</div>
      ${syncRawUrl() ? `<div class="sync-url-box">URL Raw dùng trong Shortcuts (Get Contents of URL):<br>${escapeHtml(syncRawUrl())}</div>` : ''}
    </div>

    <button class="reset-btn" id="reset-btn">Xoá toàn bộ lịch tuần</button>
  `;
}

function bindEvents(){
  const editBtn = document.getElementById('edit-btn');
  if(editBtn) editBtn.onclick = ()=>{ state.view='edit'; render(); };
  const backBtn = document.getElementById('back-btn');
  if(backBtn) backBtn.onclick = ()=>{ state.view='today'; render(); };

  const statsTeaser = document.getElementById('stats-teaser');
  if(statsTeaser) statsTeaser.onclick = ()=>{ state.view='stats'; render(); };
  const backStatsBtn = document.getElementById('back-stats-btn');
  if(backStatsBtn) backStatsBtn.onclick = ()=>{ state.view='today'; render(); };

  document.querySelectorAll('[data-check]').forEach(el=>{
    el.onchange = ()=>{
      const [dKey, actId] = el.dataset.check.split('|');
      setCompleted(dKey, actId, el.checked);
      render();
    };
  });

  const notifBtn = document.getElementById('notif-btn');
  if(notifBtn) notifBtn.onclick = ()=>{ Notification.requestPermission().then(()=> render()); };

  document.querySelectorAll('[data-act-time]').forEach(el=>{
    el.onchange = ()=>{
      const [day,slot,id] = el.dataset.actTime.split('|');
      const act = (schedule[day][slot]||[]).find(a=>a.id===id);
      if(!act) return;
      const val = el.value;
      if(val && !isTimeInSlotRange(val, slot)){
        const r = SLOT_RANGE[slot];
        const slotLabel = SLOTS.find(s=>s.key===slot).label;
        alert(`Buổi ${slotLabel} chỉ nhận giờ từ ${r.min} đến ${r.max}. Giờ bạn chọn hợp với 1 buổi khác — hãy xoá hoạt động này rồi thêm lại ở đúng buổi đó.`);
        el.value = act.time || '';
        return;
      }
      act.time = val; act.lastNotifiedDate = null; persist(); schedulePush();
    };
  });
  document.querySelectorAll('[data-act-text]').forEach(el=>{
    el.onchange = ()=>{
      const [day,slot,id] = el.dataset.actText.split('|');
      const act = (schedule[day][slot]||[]).find(a=>a.id===id);
      if(act){ act.text = el.value.trim(); persist(); schedulePush(); }
    };
  });
  document.querySelectorAll('[data-act-del]').forEach(el=>{
    el.onclick = ()=>{
      const [day,slot,id] = el.dataset.actDel.split('|');
      schedule[day][slot] = (schedule[day][slot]||[]).filter(a=>a.id!==id);
      persist(); render();
      schedulePush();
    };
  });
  document.querySelectorAll('[data-act-add]').forEach(el=>{
    el.onclick = ()=>{
      const [day,slot] = el.dataset.actAdd.split('|');
      if(!schedule[day][slot]) schedule[day][slot] = [];
      schedule[day][slot].push({id:genId(), time:'', text:''});
      persist(); render();
      schedulePush();
    };
  });

  const resetBtn = document.getElementById('reset-btn');
  if(resetBtn) resetBtn.onclick = ()=>{
    DAYS.forEach(d=> schedule[d.jsDay] = emptyDay());
    persist(); render();
    schedulePush();
  };

  const syncSaveBtn = document.getElementById('sync-save-btn');
  if(syncSaveBtn) syncSaveBtn.onclick = async ()=>{
    syncConfig.token = document.getElementById('sync-token').value.trim();
    syncConfig.gistId = document.getElementById('sync-gistid').value.trim();
    saveSyncConfig();
    if(!syncConfig.token || !syncConfig.gistId){
      setSyncStatusText('Cần nhập cả token và Gist ID (hoặc bấm "Tạo Gist mới" nếu chưa có).');
      return;
    }
    setSyncStatusText('Đang đồng bộ...');
    try{
      await pullFromGist();
      await pushToGist();
      render();
    }catch(err){
      setSyncStatusText('Lỗi: kiểm tra token/Gist ID — ' + err.message);
    }
  };

  const syncCreateBtn = document.getElementById('sync-create-btn');
  if(syncCreateBtn) syncCreateBtn.onclick = async ()=>{
    syncConfig.token = document.getElementById('sync-token').value.trim();
    if(!syncConfig.token){ setSyncStatusText('Nhập token trước đã.'); return; }
    saveSyncConfig();
    setSyncStatusText('Đang tạo Gist...');
    try{
      await createGist();
      render();
    }catch(err){
      setSyncStatusText('Lỗi tạo Gist: ' + err.message);
    }
  };
}

function checkNotifications(){
  if(state.view !== 'today') return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const jsDay = now.getDay();
  const todayStr = now.toDateString();
  const nowMinutes = now.getHours()*60 + now.getMinutes();
  const daySchedule = schedule[jsDay];
  if(!daySchedule) return;
  let changed = false;
  SLOTS.forEach(s=>{
    (daySchedule[s.key]||[]).forEach(a=>{
      if(!a.time || !(a.text||'').trim()) return;
      if(a.lastNotifiedDate === todayStr) return;
      const [h,m] = a.time.split(':').map(Number);
      const actMinutes = h*60+m;
      if(nowMinutes >= actMinutes && nowMinutes <= actMinutes+5){
        a.lastNotifiedDate = todayStr;
        changed = true;
        try{ new Notification('Dayflow', {body: a.text}); }catch(e){}
      }
    });
  });
  if(changed) persist();
}
setInterval(checkNotifications, 15000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkNotifications(); });

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

render();
checkNotifications();
if(syncConfig.token && syncConfig.gistId){
  pullFromGist().then(()=> render()).catch(()=>{});
}
setInterval(()=>{ if(state.view==='today') render(); }, 60000);
</script>
</body>
</html>
